name: Build APK

# Cara pakai: upload proyek ini ke repo GitHub milikmu, lalu buka tab
# Actions > "Build APK" > Run workflow. APK-nya muncul di bagian Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Melengkapi file platform yang hilang (gradlew, dll). File yang sudah
      # ada TIDAK ditimpa.
      - name: Lengkapi scaffold Android
        run: flutter create --platforms=android --project-name dompetku --org com.dompetku .

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dompetku-apk
          path: build/app/outputs/flutter-apk/app-release.apk
